[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false

[workspace.dependencies]
# Só os tipos Vulkan: sem `loaded`/`debug` (a layer nunca carrega libvulkan por conta própria).
ash = { version = "0.38", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
