[package]
name = "linux-reshade-control"
description = "App de controle do linux-reshade (por enquanto, só a CLI de estado)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "lrctl"
path = "src/main.rs"

[dependencies]
config = { path = "../config" }
ini = { path = "../ini" }
ipc = { path = "../ipc" }
control-core = { path = "../control-core" }
shortcuts = { path = "../shortcuts" }
shortcuts-portal = { path = "../shortcuts-portal" }
fx-bundle = { path = "../fx-bundle" }
preset = { path = "../preset" }
panel = { path = "../panel" }
rustix = { version = "1", default-features = false, features = ["std", "process"] }
